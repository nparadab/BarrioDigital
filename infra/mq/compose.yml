services:
  rabbitmq1:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_ERLANG_COOKIE: "BARRIODIGITAL_MQ_COOKIE_SECRET"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${RABBITMQ_NODE1_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_NODE1_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - barriodigital-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  rabbitmq2:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_ERLANG_COOKIE: "BARRIODIGITAL_MQ_COOKIE_SECRET"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${RABBITMQ_NODE2_AMQP_PORT:-5673}:5672"
      - "${RABBITMQ_NODE2_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - barriodigital-net
    depends_on:
      rabbitmq1:
        condition: service_started
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  rabbitmq1_data:
  rabbitmq2_data:

networks:
  barriodigital-net:
    driver: bridge
