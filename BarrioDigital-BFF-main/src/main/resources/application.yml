server:
  port: 8080

spring:
  application:
    name: ms-barriodigital-bff

azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:5970cdb9-bbea-48dd-ad49-c3aacc2c1241}
    client-id: ${AZURE_CLIENT_ID:dca1a06c-9b36-484d-8909-ae95c3f26301}
    audience: ${AZURE_AUDIENCE:api://dca1a06c-9b36-484d-8909-ae95c3f26301}

security:
  jwt:
    issuer: ${JWT_ISSUER:https://login.microsoftonline.com/5970cdb9-bbea-48dd-ad49-c3aacc2c1241/v2.0}
    audience: ${azure.activedirectory.audience}
  mock-auth:
    enabled: ${MOCK_AUTH_ENABLED:true}

services:
  requests:
    url: ${REQUESTS_SERVICE_URL:http://localhost:8081}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  rabbitadmin:
    url: ${RABBITADMIN_SERVICE_URL:http://localhost:8084}
  notify:
    url: ${NOTIFY_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
